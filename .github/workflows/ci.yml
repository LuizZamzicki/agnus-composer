name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  servicos:
    name: Microsservicos (lint + build + testes)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: services/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npm run lint
      - run: npm test

  frontend:
    name: Loja (lint + testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agnus-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            agnus-front/package-lock.json
      # O ESLint do front usa o eslint.config.js da raiz, que depende de @eslint/js e globals.
      - name: Dependencias da raiz (config do ESLint)
        working-directory: .
        run: npm ci --ignore-scripts
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: false

  admin-front:
    name: Painel admin (testes + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agnus-admin-front
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: agnus-admin-front/package-lock.json
      - run: npm ci --legacy-peer-deps
      - run: npm test -- --watchAll=false
        env:
          CI: true
      - run: npm run build
        env:
          CI: false

  compose:
    name: docker-compose valido
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gerar arquivos .env de exemplo
        run: |
          cp .env.example .env
          touch services/.env
      - run: docker compose config --quiet
      - run: AGNUS_VERSION=ci docker compose -f docker-compose.yml -f docker-compose.prod.yml config --quiet
