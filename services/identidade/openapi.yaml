openapi: 3.0.3
info:
  title: Agnus - serviço de identidade
  version: 3.5.0
  description: |
    API REST do e-commerce Agnus (roupas esportivas com estampas catolicas, modelo print on demand).

    - Em producao a API e exposta pelo Nginx sob o prefixo `/api` (ex.: `https://localhost/api/products`).
    - Rotas administrativas exigem `Authorization: Bearer <token>` e a permissao do cargo (RBAC).
    - Toda resposta traz o cabecalho `X-Request-Id`, que tambem aparece nos logs estruturados.
    - Leituras de produtos e categorias usam cache Redis (cache-aside com TTL), invalidado nas escritas.
servers:
  - url: /api
    description: Via Nginx (docker compose)
  - url: http://localhost:3000
    description: Backend direto (desenvolvimento)
tags:
  - name: Observabilidade
  - name: Autenticacao
  - name: Usuarios
  - name: Enderecos
  - name: Contatos
paths:
  /health:
    get:
      operationId: getHealth
      tags: [ Observabilidade ]
      summary: Liveness do backend (usado pelo healthcheck do Docker)
      responses:
        "200":
          description: Servico no ar
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: ok }
      security: []
  /auth/login:
    post:
      operationId: postAuthLogin
      tags: [ Autenticacao ]
      summary: Login com e-mail e senha
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ email, senha ]
              properties:
                email: { type: string, format: email, example: cliente@agnus.com }
                senha: { type: string, format: password, example: "Senha@123" }
      responses:
        "200":
          description: Autenticado
          content:
            application/json:
              schema:
                type: object
                properties:
                  token: { type: string, description: JWT }
                  user: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "429":
          description: Muitas tentativas por IP; aguarde um minuto
      security: []
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [ Autenticacao ]
      summary: Dados do usuario autenticado
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Usuario logado
          content:
            application/json:
              schema:
                type: object
                properties:
                  user: { $ref: "#/components/schemas/Usuario" }
        "401": { $ref: "#/components/responses/Unauthorized" }
  /auth/google:
    get:
      operationId: getAuthGoogle
      tags: [ Autenticacao ]
      summary: Inicia o fluxo OAuth 2.0 com o Google
      parameters:
        - in: query
          name: redirect
          schema: { type: string }
          description: URL de retorno do app mobile. Em producao so o esquema agnusapp:// e aceito; Expo e localhost valem apenas em desenvolvimento
        - in: query
          name: nonce
          schema: { type: string }
          description: Valor gerado pelo site e devolvido no retorno, para o navegador so aceitar um login que ele mesmo comecou
      responses:
        "302": { description: Redireciona para accounts.google.com }
      security: []
  /auth/google/callback:
    get:
      operationId: getAuthGoogleCallback
      tags: [ Autenticacao ]
      summary: Callback do Google; cria/vincula o usuario e redireciona ao frontend com o token
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        "302": { description: Redireciona ao frontend com `token` na query }
      security: []

  /users:
    post:
      operationId: postUsers
      tags: [ Usuarios ]
      summary: Cadastro de cliente
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "409": { $ref: "#/components/responses/Conflict" }
        "429":
          description: Muitas tentativas por IP; aguarde um minuto
      security: []
    get:
      operationId: getUsers
      tags: [ Usuarios ]
      summary: Lista usuarios (permissao USUARIO_LISTAR)
      security: [ { bearerAuth: [] } ]
      parameters:
        - $ref: "#/components/parameters/Page"
        - $ref: "#/components/parameters/Limit"
      responses:
        "200":
          description: Pagina de usuarios
          content:
            application/json:
              schema:
                type: object
                properties:
                  data: { type: array, items: { $ref: "#/components/schemas/Usuario" } }
                  pagination: { $ref: "#/components/schemas/Pagination" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /users/{id}:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    get:
      operationId: getUsersPorId
      tags: [ Usuarios ]
      summary: Detalhe do usuario (proprio usuario ou admin)
      security: [ { bearerAuth: [] } ]
      responses:
        "200":
          description: Usuario
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Usuario" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    put:
      operationId: putUsersPorId
      tags: [ Usuarios ]
      summary: Atualiza dados do usuario (proprio usuario ou admin)
      description: O campo senha e recusado com 400; a troca de senha usa PATCH /users/{id}/password, que confere a senha atual.
      security: [ { bearerAuth: [] } ]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UsuarioInput" }
      responses:
        "200": { description: Atualizado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
    delete:
      operationId: deleteUsersPorId
      tags: [ Usuarios ]
      summary: Remove usuario (permissao USUARIO_EXCLUIR)
      security: [ { bearerAuth: [] } ]
      responses:
        "204": { description: Removido }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
  /users/{id}/password:
    parameters: [ { $ref: "#/components/parameters/Id" } ]
    patch:
      operationId: patchUsersPorIdPassword
      tags: [ Usuarios ]
      summary: Troca de senha com validacao de forca e historico
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ senha_atual, nova_senha ]
              properties:
                senha_atual: { type: string, format: password }
                confirmacao_senha_atual: { type: string, format: password }
                nova_senha: { type: string, format: password }
      responses:
        "200": { description: Senha alterada }
        "400": { $ref: "#/components/responses/BadRequest" }

  /user-addresses:
    post:
      operationId: postUserAddresses
      tags: [ Enderecos ]
      summary: Cadastra endereco de entrega
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/EnderecoInput" }
      responses:
        "201":
          description: Criado
          content:
            application/json:
              schema: { $ref: "#/components/schemas/Endereco" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []
  /user-addresses/{id_user}:
    get:
      operationId: getUserAddressesPorIdUser
      tags: [ Enderecos ]
      summary: Enderecos de um usuario
      parameters:
        - { in: path, name: id_user, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200":
          description: Lista de enderecos
          content:
            application/json:
              schema: { type: array, items: { $ref: "#/components/schemas/Endereco" } }
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
      security:
        - bearerAuth: []

  /user-contacts:
    post:
      operationId: postUserContacts
      tags: [ Contatos ]
      summary: Cadastra contato (telefone/WhatsApp) do proprio usuario
      security: [ { bearerAuth: [] } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ id_usuario, valor ]
              properties:
                id_usuario: { type: integer }
                tipo: { type: string, enum: [ telefone, celular, email, outro ] }
                valor: { type: string, example: "(45) 99999-0000" }
                principal: { type: boolean }
      responses:
        "201": { description: Contato criado }
        "400": { $ref: "#/components/responses/BadRequest" }
        "403": { $ref: "#/components/responses/Forbidden" }
  /user-contacts/{id_user}:
    get:
      operationId: getUserContactsPorIdUser
      tags: [ Contatos ]
      summary: Contatos do usuario (proprio usuario ou admin)
      security: [ { bearerAuth: [] } ]
      parameters:
        - { in: path, name: id_user, required: true, schema: { type: integer, minimum: 1 } }
      responses:
        "200": { description: Contatos }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: integer, minimum: 1 }
    Page:
      in: query
      name: page
      schema: { type: integer, minimum: 1, default: 1 }
    Limit:
      in: query
      name: limit
      schema: { type: integer, minimum: 1, default: 10 }
  responses:
    BadRequest:
      description: Dados invalidos
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Unauthorized:
      description: Token ausente, invalido ou credenciais incorretas
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Forbidden:
      description: Cargo sem permissao para a operacao
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    NotFound:
      description: Recurso nao encontrado
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
    Conflict:
      description: Conflito com o estado atual (duplicidade ou vinculo)
      content:
        application/json:
          schema: { $ref: "#/components/schemas/Error" }
  schemas:
    Error:
      type: object
      properties:
        message: { type: string, example: Produto nao encontrado }
    Pagination:
      type: object
      properties:
        page: { type: integer }
        limit: { type: integer }
        total: { type: integer }
        totalPages: { type: integer }
        hasNextPage: { type: boolean }
        hasPreviousPage: { type: boolean }
    Metrics:
      type: object
      properties:
        uptimeSeconds: { type: integer }
        counters: { type: object, additionalProperties: { type: number } }
        latencyMs:
          type: object
          properties:
            window: { type: integer }
            p50: { type: number }
            p95: { type: number }
            p99: { type: number }
        sli:
          type: object
          properties:
            availability: { type: number, nullable: true }
            cacheHitRatio: { type: number, nullable: true }
    Usuario:
      type: object
      properties:
        id_usuario: { type: integer }
        nome: { type: string }
        cpf: { type: string, nullable: true }
        email: { type: string, format: email }
        tipo: { type: string, enum: [ cliente, administrador ] }
        data_criacao: { type: string, format: date-time }
    UsuarioInput:
      type: object
      required: [ nome, email, senha ]
      properties:
        nome: { type: string }
        cpf: { type: string }
        email: { type: string, format: email }
        senha: { type: string, format: password }
    Endereco:
      allOf:
        - $ref: "#/components/schemas/EnderecoInput"
        - type: object
          properties:
            id_usuario_endereco: { type: integer }
    EnderecoInput:
      type: object
      required: [ id_usuario, cep, logradouro ]
      properties:
        id_usuario: { type: integer }
        cep: { type: string, example: "80000-000" }
        logradouro: { type: string }
        numero: { type: string }
        complemento: { type: string }
        bairro: { type: string }
        cidade: { type: string }
        estado: { type: string, example: PR }
        pais: { type: string, example: Brasil }
        principal: { type: boolean }
    Categoria:
      type: object
      properties:
        id_categoria: { type: integer }
        nome: { type: string, example: Camisetas }
    CategoriaInput:
      type: object
      required: [ nome ]
      properties:
        nome: { type: string }
    Produto:
      type: object
      properties:
        id_produto: { type: integer }
        id_categoria: { type: integer, nullable: true }
        nome: { type: string, example: Camiseta Dry Fit Agnus Dei }
        descricao: { type: string, nullable: true }
        preco_custo: { type: number, nullable: true }
        preco_base: { type: number, example: 89.9 }
        margem_lucro: { type: number, nullable: true }
        ativo: { type: boolean }
    ProdutoPage:
      type: object
      properties:
        data: { type: array, items: { $ref: "#/components/schemas/Produto" } }
        pagination: { $ref: "#/components/schemas/Pagination" }
    ProdutoInput:
      type: object
      required: [ nome, preco_base ]
      properties:
        id_categoria: { type: integer, nullable: true }
        nome: { type: string }
        descricao: { type: string }
        preco_custo: { type: number }
        preco_base: { type: number }
        ativo: { type: boolean }
        grades:
          type: array
          items:
            type: object
            properties:
              nome: { type: string, example: M }
              acrescimo: { type: number, example: 0 }
        cores:
          type: array
          items:
            type: object
            properties:
              nome: { type: string, example: Preto }
              codigo_rgb: { type: string, example: "#000000" }
              acrescimo: { type: number }
              fotos: { type: array, items: { type: string } }
    PedidoStatus:
      type: string
      enum: [ aguardando_calculo_frete, aguardando_pagamento, pago, enviado, entregue, cancelado ]
    Pedido:
      type: object
      properties:
        id_pedido: { type: integer }
        id_usuario: { type: integer }
        id_usuario_endereco: { type: integer }
        status: { $ref: "#/components/schemas/PedidoStatus" }
        valor_total: { type: number, nullable: true }
        valor_frete: { type: number, nullable: true }
        data_criacao: { type: string, format: date-time }
    PedidoItem:
      type: object
      properties:
        id_pedido_item: { type: integer }
        id_pedido: { type: integer }
        id_produto_cor: { type: integer }
        id_produto_grade: { type: integer }
        quantidade: { type: integer, minimum: 1 }
        preco_unitario: { type: number, description: "Congelado no momento da compra" }
        subtotal: { type: number }
    PedidoItemInput:
      type: object
      required: [ id_pedido, id_produto_cor, id_produto_grade, quantidade ]
      properties:
        id_pedido: { type: integer }
        id_produto_cor: { type: integer }
        id_produto_grade: { type: integer }
        quantidade: { type: integer, minimum: 1 }
    PedidoInput:
      type: object
      required: [ id_usuario, id_usuario_endereco ]
      properties:
        id_usuario: { type: integer }
        id_usuario_endereco: { type: integer }
        status: { $ref: "#/components/schemas/PedidoStatus" }
        valor_frete: { type: number, description: "Ao mudar, o valor_total e recalculado (itens + frete)" }
