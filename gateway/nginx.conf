# Gateway da Agnus: unico ponto de entrada. Cada caminho da API vai para o servico dono dele.
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Um servico recriado muda de IP: o DNS do Docker e consultado continuamente (deploy independente).
resolver 127.0.0.11 valid=5s ipv6=off;

upstream identidade {
    zone upstream_identidade 64k;
    server identidade:3000 resolve;
    keepalive 8;
}

upstream catalogo {
    zone upstream_catalogo 64k;
    server catalogo:3000 resolve;
    keepalive 8;
}

upstream avaliacoes {
    zone upstream_avaliacoes 64k;
    server avaliacoes:3000 resolve;
    keepalive 8;
}

upstream carrinho {
    zone upstream_carrinho 64k;
    server carrinho:3000 resolve;
    keepalive 8;
}

upstream pedidos {
    zone upstream_pedidos 64k;
    server pedidos:3000 resolve;
    keepalive 8;
}

upstream notificacoes {
    zone upstream_notificacoes 64k;
    server notificacoes:3000 resolve;
    keepalive 8;
}

upstream admin {
    zone upstream_admin 64k;
    server admin:3000 resolve;
    keepalive 8;
}

server {
    listen 80;
    server_name agnus;

    return 301 https://$host$request_uri;
}

# Entrada do tunel ngrok (app mobile e callback do Google): mesmas rotas, sem o prefixo /api.
server {
    listen 8080;
    server_name agnus-ngrok;

    server_tokens off;
    client_max_body_size 20m;

    # O IP real vem do ngrok; sem isto, todos os clientes do tunel contariam como um so no rate limit.
    set_real_ip_from 172.16.0.0/12;
    real_ip_header X-Forwarded-For;

    rewrite ^/(.*)$ /api/$1 last;

    include /etc/nginx/agnus/rotas.conf;
}

server {
    listen 443 ssl;
    server_name agnus;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; connect-src 'self' https://viacep.com.br; form-action 'self';" always;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/agnus.pem;
    ssl_certificate_key /etc/nginx/certs/agnus-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    include /etc/nginx/agnus/rotas.conf;

    # Painel administrativo: outro build, publicado em volume proprio.
    location = /admin {
        return 301 /admin/;
    }

    location /admin/static/ {
        root /usr/share/nginx/apps;
        expires 1y;
        access_log off;
    }

    location /admin/ {
        root /usr/share/nginx/apps;
        try_files $uri /admin/index.html;
    }

    # Arquivos do build com hash no nome: podem ficar em cache no navegador.
    location /static/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
