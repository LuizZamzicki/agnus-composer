# Incluido nos dois servidores do gateway. As rotas /internal de cada servico nao aparecem aqui
# de proposito: chamada entre servicos nao passa pelo gateway.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-Id $request_id;
proxy_set_header Connection "";

# Um servico travado nao prende a conexao do cliente indefinidamente.
proxy_connect_timeout 5s;
proxy_send_timeout 30s;
proxy_read_timeout 30s;

location = /api {
    return 301 /api/;
}

location = /api/auth/login {
    limit_req zone=login burst=5 nodelay;
    limit_req_status 429;

    proxy_pass http://identidade/auth/login;
}

location = /api/health {
    proxy_pass http://admin/health;
}

location ~ ^/api/specs/(identidade|catalogo|avaliacoes|carrinho|pedidos|notificacoes)\.json$ {
    proxy_pass http://$1/openapi.json;
}

location ~ ^/api/(users|auth|user-addresses|user-contacts)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://identidade;
}

location ~ ^/api/(categories|products|product-colors|product-photos|product-grades|produto_fotos)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://catalogo;
}

location ~ ^/api/(product-reviews|product-review-photos|avaliacao_fotos)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://avaliacoes;
}

location ~ ^/api/(carts|cart-items)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://carrinho;
}

location ~ ^/api/(orders|order-items)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://pedidos;
}

location ~ ^/api/(notifications)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://notificacoes;
}

location ~ ^/api/(admin|metrics|docs)(/|$) {
    rewrite ^/api/(.*)$ /$1 break;
    proxy_pass http://admin;
}

location /api/ {
    default_type application/json;
    return 404 '{"message":"Rota não encontrada."}';
}
