# Limite de tentativas de login por IP (protege contra forca bruta).
limit_req_zone $binary_remote_addr zone=login:10m rate=10r/m;

# Pool de conexoes reaproveitadas com a API (keepalive exige HTTP/1.1 e Connection vazio).
upstream agnus_api {
    server backend:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name agnus;

    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name agnus;

    server_tokens off;
    client_max_body_size 20m;

    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Content-Security-Policy "base-uri 'self'; object-src 'none'; frame-ancestors 'none'; script-src 'self'; connect-src 'self' https://viacep.com.br; form-action 'self';" always;

    add_header Strict-Transport-Security "max-age=31536000" always;

    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate /etc/nginx/certs/agnus.pem;
    ssl_certificate_key /etc/nginx/certs/agnus-key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_vary on;
    gzip_types text/css application/javascript application/json image/svg+xml text/plain;

    location = /api {
        return 301 /api/;
    }

    location = /api/auth/login {
        limit_req zone=login burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://agnus_api/auth/login;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";
    }

    location /api/ {
        proxy_pass http://agnus_api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id $request_id;
        proxy_set_header Connection "";

        # Um backend travado nao prende a conexao do cliente indefinidamente.
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Arquivos do build com hash no nome: podem ficar em cache no navegador.
    location /static/ {
        expires 1y;
        access_log off;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
