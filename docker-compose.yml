services:

  mysql:
    image: mysql:8.4
    container_name: agnus-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: ${MYSQL_DATABASE}
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - data
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -p$${MYSQL_ROOT_PASSWORD}"]
      interval: 10s
      timeout: 5s
      retries: 10

  meilisearch:
    image: getmeili/meilisearch:v1.13
    container_name: agnus-meili
    restart: unless-stopped
    environment:
      MEILI_NO_ANALYTICS: "true"
    volumes:
      - meili_data:/meili_data
    networks:
      - data

  backend:
    build:
      context: ./agnus-back
    container_name: agnus-backend
    restart: unless-stopped
    env_file:
      - ./agnus-back/.env
    ports:
      - "3000:3000"
    depends_on:
      mysql:
        condition: service_healthy
      meilisearch:
        condition: service_started
    volumes:
      - produto_fotos:/app/produto_fotos
      - avaliacao_fotos:/app/avaliacao_fotos
    networks:
      - app
      - data
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:3000/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 10

  ngrok:
    image: ngrok/ngrok:latest
    container_name: agnus-ngrok
    restart: unless-stopped
    environment:
      NGROK_AUTHTOKEN: ${NGROK_AUTHTOKEN}
    command:
      - "http"
      - "--url=${NGROK_DOMAIN}"
      - "backend:3000"
    ports:
      - "4040:4040"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app

  frontend:
    build:
      context: ./agnus-front
    container_name: agnus-frontend
    volumes:
      - frontend_build:/output

  nginx:
    image: nginx:alpine
    container_name: agnus-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./agnus-front/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./certs:/etc/nginx/certs:ro
      - frontend_build:/usr/share/nginx/html:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_completed_successfully
    networks:
      - app
    healthcheck:
      test: ["CMD-SHELL", "wget -q --no-check-certificate -O /dev/null https://localhost/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  mysql_data:
  meili_data:
  produto_fotos:
  avaliacao_fotos:
  frontend_build:

networks:
  app:
  data:
    internal: true
